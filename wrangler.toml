name = "learn"
main = "src/worker.py"
compatibility_date = "2024-09-23"
compatibility_flags = ["python_workers"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*", "/media/*", "/admin", "/admin/*", "/admin-*", "/ref/*", "/activity/*", "/blog/*", "/en/*", "/es/*", "/fr/*", "/de/*", "/zh/*", "/*.html", "/", "/activity", "/classes-map", "/requests", "/waiting-rooms", "/cart", "/checkout-success", "/dashboard", "/donate", "/feedback", "/forgot-password", "/login", "/notification-preferences", "/notifications", "/profile", "/users", "/public-profile", "/referral-leaderboard", "/reset-password", "/status", "/teach", "/verify-email", "/virtual-classroom", "/whiteboard", "/calculator", "/contributors", "/gsoc", "/about", "/terms", "/privacy", "/cookies", "/429", "/500", "/features", "/legacy-features", "/forum", "/blog", "/study-groups", "/quizzes", "/surveys", "/challenges", "/progress", "/grade-links", "/calendar", "/memes", "/success-stories", "/feature-votes", "/messages"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"


# Run `wrangler d1 create education_db` and paste the returned UUID below.
[[d1_databases]]
binding = "DB"
database_name = "education_db"
database_id = "1daa17e9-6d9a-448f-b7a1-98e58edd8128"
migrations_dir = "migrations"


# To enable R2 avatar storage:
#   1. Create the bucket:  wrangler r2 bucket create learn-avatars
#   2. Enable public access in the Cloudflare dashboard for the bucket
#   3. Add R2_PUBLIC_URL as an environment variable (Workers → Settings → Variables)
#      e.g. https://pub-xxxxx.r2.dev  or your custom domain
#   Without R2_PUBLIC_URL, the worker falls back to base64 data-URLs stored in D1.
# [[r2_buckets]]
# binding  = "R2"
# bucket_name = "learn-avatars"


# Virtual Classroom Durable Object
[[durable_objects.bindings]]
name = "CLASSROOM_DO"
class_name = "ClassroomDO"

[[durable_objects.bindings]]
name = "PRESENCE_DO"
class_name = "PresenceDO"

[[durable_objects.bindings]]
name = "CHAT_DO"
class_name = "ChatDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClassroomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PresenceDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ChatDO"]

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "alphaonelabs-production"


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[build]
command = "bash migrate.sh"

[triggers]
crons = ["0 13 * * *"]
