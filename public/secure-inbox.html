<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Secure Inbox - Alpha One Labs">
  <title>Secure Inbox - Alpha One Labs</title>
  <link rel="icon" type="image/png" href="https://alphaonelabs.com/static/images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } };
    (function () {
      if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col bg-white text-gray-900 dark:bg-black dark:text-gray-100 transition-colors duration-300 overflow-x-hidden">

  <div id="site-navbar"></div>

  <section class="border-b border-gray-200 dark:border-gray-800 bg-white/70 dark:bg-black/40 backdrop-blur">
    <div class="max-w-3xl mx-auto px-4 py-5">
      <a href="/peers.html" class="text-sm text-teal-600 dark:text-teal-400 hover:underline mb-1 inline-block">
        <i class="fas fa-arrow-left mr-1"></i> Peers
      </a>
      <h1 class="text-2xl sm:text-3xl font-bold flex items-center gap-3">
        <i class="fas fa-lock text-teal-600 dark:text-teal-400"></i> Secure Inbox
        <span id="inbox-count" class="text-sm font-normal text-gray-500"></span>
      </h1>
      <p class="text-sm text-gray-500 mt-1">Messages expire 7 days after delivery. Download to keep a copy.</p>
    </div>
  </section>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 space-y-6">
    <section class="rounded-xl border border-gray-200 dark:border-gray-700 p-4">
      <h2 class="text-lg font-semibold mb-3">Compose Secure Message</h2>
      <form id="compose-form" class="space-y-3">
        <input id="recipient" type="text" placeholder="Recipient username" required
          class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
        <textarea id="message-body" rows="3" placeholder="Your message…" required
          class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
        <button type="submit"
          class="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-semibold text-sm">
          <i class="fas fa-paper-plane mr-1"></i> Send Securely
        </button>
      </form>
    </section>

    <div id="inbox-list" class="space-y-3">
      <div class="animate-pulse rounded-xl h-24 bg-gray-200 dark:bg-gray-800"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/layout.js" defer></script>
  <script>
    const API = '';
    const token = localStorage.getItem('edu_token');
    const user = JSON.parse(localStorage.getItem('edu_user') || 'null');
    const esc = window.esc || (s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));

    if (!token || !user) window.location.href = '/login.html';

    async function apiFetch(path, opts = {}) {
      const res = await fetch(`${API}${path}`, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          ...(opts.headers || {}),
          Authorization: `Bearer ${token}`,
        },
      });
      if (res.status === 401) {
        localStorage.removeItem('edu_token');
        localStorage.removeItem('edu_user');
        window.location.href = '/login.html';
        return null;
      }
      return res;
    }

    function senderLabel(s) {
      if (!s) return 'Unknown';
      return s.name || s.username || s.id;
    }

    function formatWhen(iso) {
      if (!iso) return '';
      const d = new Date(iso.includes('T') ? iso : iso.replace(' ', 'T') + 'Z');
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString();
    }

    function renderInbox(messages) {
      const el = document.getElementById('inbox-list');
      document.getElementById('inbox-count').textContent = messages.length
        ? `(${messages.length})` : '';
      if (!messages.length) {
        el.innerHTML = `<div class="text-center py-16 text-gray-500">
          <i class="fas fa-envelope-open text-4xl mb-3 block opacity-50"></i>
          <p>No secure messages.</p></div>`;
        return;
      }
      el.innerHTML = messages.map(m => `
        <article class="rounded-xl border border-gray-200 dark:border-gray-700 p-4 ${m.is_starred ? 'ring-1 ring-amber-400/50' : ''}" data-id="${esc(m.id)}">
          <div class="flex justify-between gap-3 items-start flex-wrap">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-semibold">${esc(senderLabel(m.sender))}</span>
                ${m.is_starred ? '<i class="fas fa-star text-amber-500" title="Starred"></i>' : ''}
              </div>
              <p class="text-sm text-gray-600 dark:text-gray-400 mt-2 whitespace-pre-wrap break-words">${esc(m.content)}</p>
              <p class="text-xs text-gray-500 mt-2">Sent ${formatWhen(m.created_at)} · Expires in ${esc(m.expires_in || '')}</p>
            </div>
            <div class="flex gap-2 shrink-0">
              <button type="button" onclick="toggleStar('${esc(m.id)}')"
                class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm hover:bg-gray-50 dark:hover:bg-gray-800"
                title="Toggle star">
                <i class="fas fa-star ${m.is_starred ? 'text-amber-500' : 'text-gray-400'}"></i>
              </button>
              <button type="button" onclick="downloadMessage('${esc(m.id)}')"
                class="px-3 py-1.5 rounded-lg bg-gray-800 dark:bg-gray-200 text-white dark:text-gray-900 text-sm font-semibold">
                <i class="fas fa-download mr-1"></i> Download
              </button>
            </div>
          </div>
        </article>`).join('');
    }

    async function loadInbox() {
      const res = await apiFetch('/api/secure/inbox');
      if (!res || !res.ok) throw new Error('Failed to load inbox');
      const body = await res.json();
      renderInbox((body.data || {}).messages || []);
    }

    async function toggleStar(id) {
      const res = await apiFetch(`/api/secure/toggle-star/${encodeURIComponent(id)}`, { method: 'POST' });
      if (!res) return;
      if (!res.ok) {
        const body = await res.json();
        alert(body.error || 'Could not toggle star');
        return;
      }
      await loadInbox();
    }

    async function downloadMessage(id) {
      const res = await apiFetch(`/api/secure/download/${encodeURIComponent(id)}`);
      if (!res) return;
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        alert(body.error || 'Download failed');
        return;
      }
      const text = await res.text();
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `message_${id}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      await loadInbox();
    }

    document.getElementById('compose-form').addEventListener('submit', async e => {
      e.preventDefault();
      const recipient = document.getElementById('recipient').value.trim();
      const message = document.getElementById('message-body').value.trim();
      if (!recipient || !message) return;
      const res = await apiFetch('/api/secure/send', {
        method: 'POST',
        body: JSON.stringify({ recipient_username: recipient, message }),
      });
      if (!res) return;
      const body = await res.json();
      if (!res.ok) {
        alert(body.error || 'Send failed');
        return;
      }
      document.getElementById('message-body').value = '';
      alert(body.message || 'Sent');
    });

    loadInbox().catch(e => {
      document.getElementById('inbox-list').innerHTML =
        `<p class="text-red-600 text-center py-8">${esc(e.message)}</p>`;
    });
  </script>
</body>
</html>
