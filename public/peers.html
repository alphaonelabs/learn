<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Peer Connections - Alpha One Labs">
  <title>Peer Connections - Alpha One Labs</title>
  <link rel="icon" type="image/png" href="https://alphaonelabs.com/static/images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } };
    (function () {
      if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col bg-white text-gray-900 dark:bg-black dark:text-gray-100 transition-colors duration-300 overflow-x-hidden">

  <div id="site-navbar"></div>

  <section class="border-b border-gray-200 dark:border-gray-800 bg-white/70 dark:bg-black/40 backdrop-blur">
    <div class="max-w-5xl mx-auto px-4 py-5 flex items-center justify-between gap-4 flex-wrap">
      <h1 class="text-2xl sm:text-3xl font-bold flex items-center gap-3">
        <i class="fas fa-users text-teal-600 dark:text-teal-400"></i> Peer Connections
      </h1>
      <a href="/secure-inbox.html"
        class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-800">
        <i class="fas fa-lock"></i> Secure Inbox
      </a>
    </div>
  </section>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 space-y-8">
    <section class="rounded-xl border border-gray-200 dark:border-gray-700 p-4">
      <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
        <i class="fas fa-search text-teal-600 dark:text-teal-400"></i> Discover Users
      </h2>
      <div class="flex gap-2 flex-wrap">
        <input id="search-q" type="search" placeholder="Search by name or username…"
          class="flex-1 min-w-[200px] rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
        <button type="button" onclick="searchUsers()"
          class="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-semibold text-sm">Search</button>
      </div>
      <div id="discover-list" class="mt-4 space-y-2"></div>
    </section>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <section class="rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="border-b border-gray-200 dark:border-gray-700 p-4">
          <h2 class="text-lg font-semibold flex items-center gap-2">
            <i class="fas fa-clock text-teal-600 dark:text-teal-400"></i> Pending Requests
          </h2>
        </div>
        <div id="pending-list" class="divide-y divide-gray-200 dark:divide-gray-700">
          <div class="p-6 text-center text-gray-500 animate-pulse">Loading…</div>
        </div>
      </section>

      <section class="rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="border-b border-gray-200 dark:border-gray-700 p-4">
          <h2 class="text-lg font-semibold flex items-center gap-2">
            <i class="fas fa-link text-teal-600 dark:text-teal-400"></i> Connected Peers
          </h2>
        </div>
        <div id="connected-list" class="divide-y divide-gray-200 dark:divide-gray-700">
          <div class="p-6 text-center text-gray-500 animate-pulse">Loading…</div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/layout.js" defer></script>
  <script>
    const API = '';
    const token = localStorage.getItem('edu_token');
    const user = JSON.parse(localStorage.getItem('edu_user') || 'null');
    const esc = window.esc || (s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));

    if (!token || !user) window.location.href = '/login.html';

    async function apiFetch(path, opts = {}) {
      const res = await fetch(`${API}${path}`, {
        ...opts,
        headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` },
      });
      if (res.status === 401) {
        localStorage.removeItem('edu_token');
        localStorage.removeItem('edu_user');
        window.location.href = '/login.html';
        return null;
      }
      return res;
    }

    function peerLabel(p) {
      if (!p) return 'Unknown';
      return p.name || p.username || p.id;
    }

    function renderPending(items) {
      const el = document.getElementById('pending-list');
      const pending = items.filter(c => c.status === 'pending' && c.direction === 'received');
      if (!pending.length) {
        el.innerHTML = `<div class="p-8 text-center text-gray-500 dark:text-gray-400">
          <i class="fas fa-inbox text-4xl mb-3 block opacity-50"></i>
          <p>No pending connection requests.</p></div>`;
        return;
      }
      el.innerHTML = pending.map(c => `
        <div class="p-4 flex justify-between items-center gap-3 flex-wrap">
          <div>
            <div class="font-medium">${esc(peerLabel(c.peer))}</div>
            <div class="text-sm text-gray-500">Sent ${esc(c.created_at || '')}</div>
          </div>
          <div class="flex gap-2">
            <button type="button" onclick="handleConnection('${esc(c.id)}','accept')"
              class="bg-green-500 hover:bg-green-600 text-white font-semibold px-3 py-2 rounded-lg text-sm">
              <i class="fas fa-check mr-1"></i> Accept
            </button>
            <button type="button" onclick="handleConnection('${esc(c.id)}','reject')"
              class="border border-red-300 text-red-700 dark:text-red-300 font-semibold px-3 py-2 rounded-lg text-sm">
              <i class="fas fa-times mr-1"></i> Reject
            </button>
          </div>
        </div>`).join('');
    }

    function renderConnected(items) {
      const el = document.getElementById('connected-list');
      const connected = items.filter(c => c.status === 'accepted');
      if (!connected.length) {
        el.innerHTML = `<div class="p-8 text-center text-gray-500 dark:text-gray-400">
          <i class="fas fa-users-slash text-4xl mb-3 block opacity-50"></i>
          <p>You haven't connected with any peers yet.</p></div>`;
        return;
      }
      el.innerHTML = connected.map(c => `
        <div class="p-4 flex justify-between items-center gap-3 flex-wrap">
          <div>
            <div class="font-medium">${esc(peerLabel(c.peer))}</div>
            <div class="text-sm text-gray-500">Connected ${esc(c.updated_at || c.created_at || '')}</div>
          </div>
          <a href="/peer-messages.html?peer_id=${encodeURIComponent(c.peer?.id || '')}"
            class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-4 py-2 rounded-lg text-sm inline-flex items-center">
            <i class="fas fa-paper-plane mr-2"></i> Message
          </a>
        </div>`).join('');
    }

    function renderDiscover(users) {
      const el = document.getElementById('discover-list');
      if (!users.length) {
        el.innerHTML = '<p class="text-sm text-gray-500">No users found.</p>';
        return;
      }
      el.innerHTML = users.map(u => `
        <div class="flex justify-between items-center gap-3 p-3 rounded-lg bg-gray-50 dark:bg-gray-800/50">
          <div>
            <div class="font-medium">${esc(u.name || u.username)}</div>
            <div class="text-sm text-gray-500">@${esc(u.username || '')}</div>
          </div>
          <button type="button" onclick="connectUser('${esc(u.id)}')"
            class="px-3 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold">Connect</button>
        </div>`).join('');
    }

    async function loadPeers(q) {
      const qs = q ? `?q=${encodeURIComponent(q)}` : '';
      const res = await apiFetch(`/api/peers${qs}`);
      if (!res || !res.ok) throw new Error('Failed to load peers');
      const body = await res.json();
      const data = body.data || {};
      const all = [...(data.sent || []), ...(data.received || [])];
      renderPending(all);
      renderConnected(all);
      if (q) renderDiscover(data.discover || []);
    }

    async function searchUsers() {
      const q = document.getElementById('search-q').value.trim();
      if (!q) return;
      try {
        await loadPeers(q);
      } catch (e) {
        document.getElementById('discover-list').innerHTML =
          `<p class="text-red-600 text-sm">${esc(e.message)}</p>`;
      }
    }

    async function connectUser(userId) {
      const res = await apiFetch(`/api/peers/connect/${encodeURIComponent(userId)}`, { method: 'POST' });
      if (!res) return;
      const body = await res.json();
      if (!res.ok) {
        alert(body.error || 'Could not send request');
        return;
      }
      alert(body.message || 'Request sent');
      await loadPeers(document.getElementById('search-q').value.trim());
    }

    async function handleConnection(id, action) {
      const res = await apiFetch(`/api/peers/${encodeURIComponent(id)}/${action}`, { method: 'PATCH' });
      if (!res) return;
      const body = await res.json();
      if (!res.ok) {
        alert(body.error || 'Action failed');
        return;
      }
      await loadPeers(document.getElementById('search-q').value.trim());
    }

    document.getElementById('search-q').addEventListener('keydown', e => {
      if (e.key === 'Enter') searchUsers();
    });

    loadPeers().catch(e => {
      document.getElementById('pending-list').innerHTML =
        `<p class="p-6 text-red-600 text-center">${esc(e.message)}</p>`;
      document.getElementById('connected-list').innerHTML = '';
    });
  </script>
</body>
</html>
