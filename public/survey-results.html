<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Results - Alpha One Labs</title>
  <link rel="icon" type="image/png" href="https://alphaonelabs.com/static/images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } }
    function initializeDarkMode() {
      const darkModeEnabled = localStorage.getItem('darkMode') === 'true';
      if (darkModeEnabled) document.documentElement.classList.add('dark');
      else if (localStorage.getItem('darkMode') === null) localStorage.setItem('darkMode', 'false');
    }
    initializeDarkMode();
    document.addEventListener('DOMContentLoaded', initializeDarkMode);
  </script>

  <style>
    html, body { overflow-x: hidden; box-sizing: border-box; }
    .dark { color-scheme: dark; }
    :root { color-scheme: light; }

    .gradient-hero { background: linear-gradient(135deg, #0F766E 0%, #0D9488 50%, #06B6D4 100%); }
    .gradient-hero.dark { background: linear-gradient(135deg, #134E4A 0%, #0F766E 50%, #164E63 100%); }

    .stat-card { transition: transform 0.15s, box-shadow 0.15s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

    .chart-toggle-btn { transition: all .15s; }
    .chart-toggle-btn.active { background: #0D9488; color: #fff; }

    .skeleton { background: linear-gradient(90deg, rgba(150,150,150,0.15) 25%, rgba(150,150,150,0.25) 37%, rgba(150,150,150,0.15) 63%); background-size: 400% 100%; animation: skeleton-loading 1.4s ease infinite; }
    @keyframes skeleton-loading { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

    #toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { min-width: 260px; max-width: 360px; padding: 0.875rem 1rem; border-radius: 0.75rem; color: #fff; font-size: 0.875rem; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: toast-in 0.2s ease; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .toast-success { background: #059669; }
    .toast-error { background: #DC2626; }
  </style>
</head>

<body class="min-h-screen flex flex-col bg-gray-50 text-gray-900 dark:bg-black dark:text-gray-100 transition-colors duration-300 overflow-x-hidden">

  <div id="site-navbar"></div>

  <section class="gradient-hero text-white py-12 relative overflow-hidden">
    <div class="relative max-w-6xl mx-auto px-4 md:px-6">
      <nav class="text-teal-100 text-sm mb-4 flex items-center gap-2">
        <a href="/surveys.html" class="hover:text-white transition flex items-center gap-1"><i class="fas fa-arrow-left"></i>Surveys</a>
      </nav>
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
        <div>
          <h1 id="survey-title" class="text-3xl md:text-4xl font-extrabold text-white leading-tight mb-2">Loading…</h1>
          <p class="text-teal-100"><i class="fas fa-chart-pie mr-1.5"></i>Survey Analytics</p>
        </div>
        <div class="flex gap-2">
          <a id="take-survey-link" href="#" class="px-4 py-2.5 rounded-xl bg-white/15 hover:bg-white/25 text-white font-semibold text-sm transition backdrop-blur">
            <i class="fas fa-play mr-1.5"></i>Take Survey
          </a>
          <button onclick="exportCsv()" class="px-4 py-2.5 rounded-xl bg-white text-teal-700 font-bold text-sm shadow-lg hover:shadow-xl transition-all">
            <i class="fas fa-download mr-1.5"></i>Export CSV
          </button>
        </div>
      </div>
    </div>
  </section>

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 md:px-6 py-10 space-y-8">

    <div id="skeleton" class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="skeleton h-24 rounded-2xl"></div>
      <div class="skeleton h-24 rounded-2xl"></div>
      <div class="skeleton h-24 rounded-2xl"></div>
      <div class="skeleton h-24 rounded-2xl"></div>
    </div>

    <div id="error-state" class="hidden text-center text-red-400 py-20">
      <i class="fas fa-triangle-exclamation text-5xl mb-4 block opacity-50"></i>
      <p id="error-message" class="text-lg">These results could not be loaded.</p>
    </div>

    <div id="results-content" class="hidden space-y-8">

      <!-- Overview -->
      <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="stat-card bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-5">
          <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1"><i class="fas fa-users mr-1"></i>Participants</p>
          <p id="stat-participants" class="text-3xl font-extrabold text-gray-800 dark:text-gray-100">0</p>
        </div>
        <div class="stat-card bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-5">
          <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1"><i class="fas fa-circle-check mr-1"></i>Completion Rate</p>
          <p id="stat-completion" class="text-3xl font-extrabold text-gray-800 dark:text-gray-100">0%</p>
        </div>
        <div class="stat-card bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-5">
          <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1"><i class="fas fa-bolt mr-1"></i>Engagement Score</p>
          <p id="stat-engagement" class="text-3xl font-extrabold text-gray-800 dark:text-gray-100">0</p>
        </div>
        <div class="stat-card bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-5">
          <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1"><i class="fas fa-list-check mr-1"></i>Questions</p>
          <p id="stat-questions" class="text-3xl font-extrabold text-gray-800 dark:text-gray-100">0</p>
        </div>
      </section>

      <!-- Summary insights -->
      <section id="summary-section" class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-6">
        <h2 class="font-bold text-lg text-gray-800 dark:text-gray-200 mb-4 flex items-center"><i class="fas fa-lightbulb mr-2 text-amber-500"></i>Insights</h2>
        <div id="summary-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm"></div>
      </section>

      <!-- Question analytics -->
      <section id="question-analytics" class="space-y-6"></section>

      <div id="no-participants" class="hidden text-center text-gray-400 dark:text-gray-500 py-16">
        <i class="fas fa-inbox text-4xl mb-4 block opacity-50"></i>
        No responses yet. Share this survey to start collecting data.
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="toast-container"></div>

  <script src="/js/layout.js" defer></script>
  <script>
    const token = localStorage.getItem('edu_token');
    const params = new URLSearchParams(location.search);
    const surveyId = params.get('id');

    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    const CHART_COLORS = ['#0D9488', '#06B6D4', '#F59E0B', '#EC4899', '#10B981', '#EF4444', '#6366F1', '#84CC16'];
    const charts = {}; // questionId -> { instance, type }
    let results = null;

    function questionChartData(q) {
      if (q.type === 'true_false') {
        return { labels: ['True', 'False'], data: [q.yes_count, q.no_count] };
      }
      return { labels: q.options.map(o => o.text), data: q.options.map(o => o.count) };
    }

    function renderChart(q, chartType) {
      const canvas = document.getElementById(`chart-${q.id}`);
      if (!canvas) return;
      const { labels, data } = questionChartData(q);

      if (charts[q.id]) charts[q.id].instance.destroy();

      const isDark = document.documentElement.classList.contains('dark');
      charts[q.id] = {
        type: chartType,
        instance: new Chart(canvas, {
          type: chartType,
          data: {
            labels,
            datasets: [{
              data,
              backgroundColor: labels.map((_, i) => CHART_COLORS[i % CHART_COLORS.length]),
              borderWidth: chartType === 'pie' ? 1 : 0,
              borderRadius: chartType === 'bar' ? 6 : 0,
            }],
          },
          options: {
            responsive: true,
            plugins: { legend: { position: chartType === 'pie' ? 'right' : 'top', labels: { color: isDark ? '#e5e7eb' : '#374151' } } },
            scales: chartType === 'bar' ? {
              x: { ticks: { color: isDark ? '#9ca3af' : '#6b7280' }, grid: { display: false } },
              y: { beginAtZero: true, ticks: { color: isDark ? '#9ca3af' : '#6b7280', precision: 0 } },
            } : {},
          },
        }),
      };
    }

    function toggleChartType(qid, type) {
      const q = results.questions.find(q => q.id === qid);
      renderChart(q, type);
      document.querySelectorAll(`[data-chart-toggle="${qid}"]`).forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-type') === type);
      });
    }
    window.toggleChartType = toggleChartType;

    function questionCardHtml(q, index) {
      let body = '';
      if (q.type === 'multiple_choice' || q.type === 'checkbox' || q.type === 'true_false') {
        body = `
          <div class="flex items-center justify-end gap-1 mb-3">
            <button data-chart-toggle="${q.id}" data-type="pie" onclick="toggleChartType('${q.id}','pie')" class="chart-toggle-btn active px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
              <i class="fas fa-chart-pie mr-1"></i>Pie
            </button>
            <button data-chart-toggle="${q.id}" data-type="bar" onclick="toggleChartType('${q.id}','bar')" class="chart-toggle-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
              <i class="fas fa-chart-bar mr-1"></i>Bar
            </button>
          </div>
          <div class="max-w-md mx-auto"><canvas id="chart-${q.id}"></canvas></div>
          ${q.type !== 'true_false' ? `
            <div class="mt-4 space-y-1.5">
              ${q.options.map(o => `
                <div class="flex items-center justify-between text-sm">
                  <span class="text-gray-600 dark:text-gray-300">${esc(o.text)}</span>
                  <span class="font-semibold text-gray-800 dark:text-gray-100">${o.count} <span class="text-gray-400 font-normal">(${o.percentage}%)</span></span>
                </div>`).join('')}
            </div>` : `
            <div class="mt-4 grid grid-cols-2 gap-3 text-center">
              <div class="bg-emerald-50 dark:bg-emerald-900/20 rounded-xl p-3"><p class="text-2xl font-bold text-emerald-600 dark:text-emerald-400">${q.yes_count}</p><p class="text-xs text-gray-500 dark:text-gray-400">True</p></div>
              <div class="bg-red-50 dark:bg-red-900/20 rounded-xl p-3"><p class="text-2xl font-bold text-red-600 dark:text-red-400">${q.no_count}</p><p class="text-xs text-gray-500 dark:text-gray-400">False</p></div>
            </div>`}
        `;
      } else if (q.type === 'scale') {
        body = `
          <div class="grid grid-cols-3 gap-3 text-center mb-4">
            <div class="bg-teal-50 dark:bg-teal-900/20 rounded-xl p-3"><p class="text-2xl font-bold text-teal-600 dark:text-teal-400">${q.average}</p><p class="text-xs text-gray-500 dark:text-gray-400">Average</p></div>
            <div class="bg-gray-50 dark:bg-gray-900/40 rounded-xl p-3"><p class="text-2xl font-bold text-gray-700 dark:text-gray-300">${q.min}</p><p class="text-xs text-gray-500 dark:text-gray-400">Min</p></div>
            <div class="bg-gray-50 dark:bg-gray-900/40 rounded-xl p-3"><p class="text-2xl font-bold text-gray-700 dark:text-gray-300">${q.max}</p><p class="text-xs text-gray-500 dark:text-gray-400">Max</p></div>
          </div>
          <div class="space-y-1.5">
            ${[1,2,3,4,5].map(n => {
              const count = q.distribution[String(n)] || 0;
              const max = Math.max(1, ...Object.values(q.distribution));
              const pct = Math.round((count / max) * 100);
              return `
                <div class="flex items-center gap-2 text-xs">
                  <span class="w-3 text-gray-500 dark:text-gray-400">${n}</span>
                  <div class="flex-1 h-3 rounded-full bg-gray-100 dark:bg-gray-700 overflow-hidden"><div class="h-full bg-teal-500" style="width:${pct}%"></div></div>
                  <span class="w-6 text-right text-gray-500 dark:text-gray-400">${count}</span>
                </div>`;
            }).join('')}
          </div>`;
      } else {
        body = q.responses.length
          ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${q.responses.map(r => `
              <div class="bg-gray-50 dark:bg-gray-900/40 rounded-xl p-4 text-sm text-gray-700 dark:text-gray-300"><i class="fas fa-quote-left text-gray-300 dark:text-gray-600 mr-1.5"></i>${esc(r)}</div>`).join('')}</div>`
          : `<p class="text-sm text-gray-400 dark:text-gray-500 italic">No responses yet.</p>`;
      }

      return `
        <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-6">
          <div class="flex items-center justify-between mb-1">
            <p class="font-semibold text-gray-800 dark:text-gray-200"><span class="text-teal-600 dark:text-teal-400 mr-1">${index + 1}.</span>${esc(q.text)}</p>
            <span class="text-xs text-gray-400 dark:text-gray-500">${q.response_count} response${q.response_count === 1 ? '' : 's'}</span>
          </div>
          <div class="mt-4">${body}</div>
        </div>`;
    }

    function renderSummary() {
      const insights = [];
      const choiceQuestions = results.questions.filter(q => q.type === 'multiple_choice' || q.type === 'checkbox');

      let mostSelected = null, leastSelected = null;
      choiceQuestions.forEach(q => {
        q.options.forEach(o => {
          if (!mostSelected || o.count > mostSelected.count) mostSelected = { ...o, question: q.text };
          if (!leastSelected || o.count < leastSelected.count) leastSelected = { ...o, question: q.text };
        });
      });
      if (mostSelected) insights.push(`<i class="fas fa-arrow-trend-up text-emerald-500 mr-2"></i>Most selected option: <strong>${esc(mostSelected.text)}</strong> (${mostSelected.count} votes) on "${esc(mostSelected.question)}"`);
      if (leastSelected) insights.push(`<i class="fas fa-arrow-trend-down text-amber-500 mr-2"></i>Least selected option: <strong>${esc(leastSelected.text)}</strong> (${leastSelected.count} votes) on "${esc(leastSelected.question)}"`);

      if (results.questions.length) {
        const highest = results.questions.reduce((a, b) => (b.response_count > a.response_count ? b : a));
        insights.push(`<i class="fas fa-fire text-red-500 mr-2"></i>Highest engagement question: <strong>${esc(highest.text)}</strong> (${highest.response_count} responses)`);
      }
      insights.push(`<i class="fas fa-users text-teal-500 mr-2"></i>Total participants: <strong>${results.participant_count}</strong>`);

      document.getElementById('summary-list').innerHTML = insights.map(i => `
        <div class="flex items-start gap-1 bg-gray-50 dark:bg-gray-900/40 rounded-xl p-3.5">${i}</div>`).join('');
    }

    function renderResults() {
      document.title = results.title + ' Results - Alpha One Labs';
      document.getElementById('survey-title').textContent = results.title;
      document.getElementById('take-survey-link').href = '/survey.html?id=' + surveyId;

      document.getElementById('stat-participants').textContent = results.participant_count;
      document.getElementById('stat-completion').textContent = results.completion_rate + '%';
      document.getElementById('stat-engagement').textContent = results.engagement_score;
      document.getElementById('stat-questions').textContent = results.question_count;

      document.getElementById('skeleton').classList.add('hidden');
      document.getElementById('results-content').classList.remove('hidden');

      if (!results.participant_count) {
        document.getElementById('summary-section').classList.add('hidden');
        document.getElementById('question-analytics').classList.add('hidden');
        document.getElementById('no-participants').classList.remove('hidden');
        return;
      }

      renderSummary();
      document.getElementById('question-analytics').innerHTML = results.questions.map(questionCardHtml).join('');
      results.questions.forEach(q => {
        if (q.type === 'multiple_choice' || q.type === 'checkbox' || q.type === 'true_false') {
          renderChart(q, 'pie');
        }
      });
    }

    async function loadResults() {
      if (!surveyId) {
        document.getElementById('skeleton').classList.add('hidden');
        document.getElementById('error-message').textContent = 'No survey specified.';
        document.getElementById('error-state').classList.remove('hidden');
        return;
      }
      try {
        const headers = token ? { Authorization: 'Bearer ' + token } : {};
        const res = await fetch(`/api/surveys/${surveyId}/results`, { headers });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Results not found');
        results = data.results;
        renderResults();
      } catch (e) {
        document.getElementById('skeleton').classList.add('hidden');
        document.getElementById('error-message').textContent = e.message;
        document.getElementById('error-state').classList.remove('hidden');
      }
    }

    async function exportCsv() {
      try {
        const headers = token ? { Authorization: 'Bearer ' + token } : {};
        const res = await fetch(`/api/surveys/${surveyId}/export`, { headers });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Failed to export CSV');
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `survey-${surveyId}-export.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Export downloaded', 'success');
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    loadResults();
  </script>
</body>
</html>
